@if (rutina) {
  <div class="card mb-3">
    <div class="card-body">
      <div class="d-flex justify-content-between align-items-start gap-2">
        <div>
          <h6 class="card-title mb-2">{{ rutina.nombre }}</h6>
          <p class="card-text mb-1"><strong>ID:</strong> {{ rutina.id }}</p>
          <p class="card-text mb-0"><strong>Cliente:</strong> {{ rutina.id }}</p>
        </div>
        <div class="d-flex flex-column gap-2">
          <button class="btn btn-outline-primary btn-sm" (click)="onVer()">Ver ejercicios</button>
          <button class="btn btn-outline-danger btn-sm" (click)="onEliminar()">Eliminar</button>
        </div>
      </div>
    </div>
  </div>
}
