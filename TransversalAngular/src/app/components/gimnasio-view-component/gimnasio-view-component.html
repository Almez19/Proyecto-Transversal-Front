
<div class="card h-100 shadow-sm" style="border: 2px solid #FE7000;">
    <img [src]="gimnasio.urlImagen" class="card-img-top" [alt]="gimnasio.nombre" style="height: 300px; object-fit: cover;">
    <div class="card-body">
        <h5 class="card-title">{{ gimnasio.nombre }}</h5>
        <div class="d-flex justify-content-between align-items-center mb-2">
            <p class="card-title">{{ gimnasio.ciudad }}</p>
            <span class="badge" [ngClass]="gimnasio.ciudad">
            </span>
        </div>
        <button class="btn btn-primary w-100" [routerLink]="['/gimnasios', gimnasio.id]">
            Ver Detalles
        </button>

        <button class="btn btn-outline-warning w-100 mt-2" (click)="alternarGuardar($event)">
            @if (guardado) { Guardado ✓ } @else { Guardar gimnasio }
        </button>
    </div>
</div>
