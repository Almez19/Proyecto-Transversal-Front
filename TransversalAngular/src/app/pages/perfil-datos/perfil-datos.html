<div class="p-4 rounded-3 shadow-sm bf-panel">
  <div class="d-flex justify-content-between align-items-start gap-3">
    <div>
      <h5 class="fw-semibold mb-2 bf-title"><i class="bi bi-person-lines-fill me-2"></i>Mis datos</h5>
      <div class="bf-muted">Revisa y edita tus datos personales y de acceso.</div>
    </div>
  </div>

  @if (cargando) {
    <div class="text-secondary">Cargando…</div>
  } @else {

    @if (error) {
      <div class="alert alert-danger mt-3">{{ error }}</div>
    }
    @if (mensaje) {
      <div class="alert alert-success mt-3">{{ mensaje }}</div>
    }

    <div class="row mt-3 g-3">
      <div class="col-lg-7">
        <div class="card shadow-sm" style="border:1px solid #dee2e6; border-radius:1rem;">
          <div class="card-body p-4">
            <div class="fw-semibold mb-3" style="color:#FE7000;">Datos personales</div>

            <div class="row g-3">
              <div class="col-md-4">
                <label class="form-label">Nombre</label>
                <input class="form-control" [(ngModel)]="nombre" />
              </div>
              <div class="col-md-4">
                <label class="form-label">Apellido 1</label>
                <input class="form-control" [(ngModel)]="apellido1" />
              </div>
              <div class="col-md-4">
                <label class="form-label">Apellido 2</label>
                <input class="form-control" [(ngModel)]="apellido2" />
              </div>

              <div class="col-md-6">
                <label class="form-label">Email</label>
                <input class="form-control" [value]="email" disabled />
                <div class="form-text">El email se usa para iniciar sesión y no se modifica desde aquí.</div>
              </div>
              <div class="col-md-6">
                <label class="form-label">DNI / NIE</label>
                <input class="form-control" [(ngModel)]="dniNie" />
              </div>

              <div class="col-md-6">
                <label class="form-label">Teléfono</label>
                <input class="form-control" [(ngModel)]="telefono" placeholder="Ej: 600123456" />
              </div>
              <div class="col-md-6">
                <label class="form-label">Ciudad</label>
                <input class="form-control" [(ngModel)]="ciudad" />
              </div>

              <div class="col-md-6">
                <label class="form-label">Fecha de nacimiento</label>
                <input type="date" class="form-control" [(ngModel)]="fechaNacimiento" />
              </div>
            </div>

            <div class="mt-4 d-flex justify-content-end">
              <button class="btn btn-bf" (click)="guardarDatos()" [disabled]="guardando">
                @if (guardando) { Guardando… } @else { Guardar cambios }
              </button>
            </div>
          </div>
        </div>
      </div>

      <div class="col-lg-5">
        <div class="card shadow-sm" style="border:1px solid #dee2e6; border-radius:1rem;">
          <div class="card-body p-4">
            <div class="fw-semibold mb-3" style="color:#FE7000;">Seguridad</div>

            <label class="form-label">Contraseña actual</label>
            <input type="password" class="form-control" [(ngModel)]="passActual" />

            <label class="form-label mt-3">Nueva contraseña</label>
            <input type="password" class="form-control" [(ngModel)]="passNueva" />

            <label class="form-label mt-3">Repite la nueva contraseña</label>
            <input type="password" class="form-control" [(ngModel)]="passNueva2" />

            <div class="mt-4 d-grid">
              <button class="btn btn-bf-outline" (click)="cambiarPassword()" [disabled]="guardando">
                @if (guardando) { Actualizando… } @else { Cambiar contraseña }
              </button>
            </div>

            <div class="mt-3 small text-muted">
              Consejo: usa una contraseña con letras y números.
            </div>
          </div>
        </div>
      </div>
    </div>
  }
</div>
