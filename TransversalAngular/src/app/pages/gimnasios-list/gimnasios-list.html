<div class="container mt-4">

    <div class="row mb-4">

        <!-- Buscador -->
        <div class="col-md-4">
            <input 
                type="text"
                class="form-control"
                placeholder="Buscar por nombre o ciudad..."
                [(ngModel)]="searchText"
                (input)="filtrarGimnasios()">
        </div>

        <!-- Solo abiertos -->
        <div class="col-md-3 d-flex align-items-center">
            <input 
                type="checkbox"
                class="form-check-input me-2"
                [(ngModel)]="soloAbiertos"
                (change)="filtrarGimnasios()">
            <label class="form-check-label">
                Abiertos
            </label>
        </div>

        <!-- Solo cerrados -->
        <div class="col-md-3 d-flex align-items-center">
            <input 
                type="checkbox"
                class="form-check-input me-2"
                [(ngModel)]="soloCerrados"
                (change)="filtrarGimnasios()">
            <label class="form-check-label">
                Cerrados
            </label>
        </div>

    </div>

    <div class="row">

        @if (gimnasioFiltradoArr.length === 0) {
            <div class="col-12 text-center">
                <p class="text-muted">No hay gimnasios que coincidan con la búsqueda</p>
            </div>
        } @else {

            @for (gimnasios of gimnasioFiltradoArr; track gimnasios.id) {
                <div class="col-md-4 mb-4">
                    <app-gimnasio-view-component 
                        [gimnasio]="gimnasios">
                    </app-gimnasio-view-component>
                </div>
            }

        }

    </div>

</div>
